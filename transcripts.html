<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wei Jing's Peaceful English Sanctuary | All Lesson Transcripts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            parchment: {
              50: '#fbf9f5',
              100: '#f5f0e6',
              200: '#ebe2d0',
              300: '#dfd0b5',
            },
            sage: {
              50: '#f3f6f4',
              100: '#e2eae4',
              200: '#c7d6cb',
              500: '#5d8268',
              600: '#496953',
              700: '#3b5443',
              800: '#314437',
            },
            autumn: {
              50: '#fdf6ef',
              100: '#fae8d4',
              200: '#f4cda8',
              500: '#d97b38',
              600: '#c16224',
              700: '#9e4c1d',
            },
            slatewarm: {
              800: '#2e3438',
              900: '#1f2427',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: linear-gradient(160deg, #faf6ee 0%, #f4ede0 50%, #edf2ec 100%);
      color: #2e3438;
      min-height: 100vh;
    }
    .sanctuary-card {
      background: rgba(255, 253, 249, 0.92);
      border: 1px solid rgba(223, 208, 181, 0.78);
      box-shadow: 0 10px 30px -12px rgba(60, 48, 30, 0.08);
    }
  </style>
</head>
<body class="font-sans antialiased">
  <!-- Sticky Top Navigation -->
  <header class="sticky top-0 z-40 border-b border-[#e6decb]/90 bg-[#fbf9f5]/90 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-sage-600 via-sage-500 to-autumn-500 flex items-center justify-center text-white font-serif text-xl font-bold shadow-sm">
          W
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-serif font-bold text-lg sm:text-xl tracking-tight text-slatewarm-900">Wei Jing's Lesson Transcripts</span>
            <span class="hidden sm:inline-flex items-center px-2.5 py-0.5 text-[11px] font-medium rounded-full bg-sage-100 text-sage-800 border border-sage-200">
              All 4 Lessons
            </span>
          </div>
          <p class="text-[11px] text-stone-500 hidden md:block">Choose any lesson below to read, search, or listen to the full conversation</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <a href="index.html" class="px-3 py-1.5 rounded-xl bg-white hover:bg-sage-50 border border-[#dfd0b5] text-xs font-semibold text-sage-800 shadow-sm transition">
          🌿 Lesson 04 Sanctuary
        </a>
        <a href="lesson-01.html" class="px-3 py-1.5 rounded-xl bg-white hover:bg-sage-50 border border-[#dfd0b5] text-xs font-semibold text-sage-800 shadow-sm transition">
          📜 Lesson 01 Notes
        </a>
        <a href="jeopardy.html" class="px-3 py-1.5 rounded-xl bg-autumn-600 hover:bg-autumn-700 text-white text-xs font-bold shadow-sm transition">
          🏆 Play Jeopardy!
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">
    <!-- Lesson Selector Grid -->
    <section class="sanctuary-card rounded-3xl p-5 sm:p-6">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
        <div>
          <span class="text-xs font-mono uppercase tracking-widest text-sage-700 font-semibold">Select a Lesson</span>
          <h1 class="font-serif text-2xl sm:text-3xl font-bold text-slatewarm-900">Choose Your Lesson Transcript</h1>
        </div>
        <span class="text-xs text-stone-500" id="lesson-count-label">4 lessons available</span>
      </div>

      <div id="lesson-selector-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3"></div>
    </section>

    <!-- Active Lesson Header & Filters -->
    <section class="sanctuary-card rounded-3xl p-5 sm:p-6 space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-parchment-200 pb-4">
        <div>
          <div class="flex flex-wrap items-center gap-2">
            <span id="active-lesson-badge" class="px-2.5 py-0.5 rounded-full bg-autumn-100 text-autumn-800 text-xs font-bold">Lesson 01</span>
            <span id="active-lesson-date" class="text-xs font-mono text-stone-500"></span>
            <span id="active-lesson-duration" class="text-xs font-mono text-sage-700 bg-sage-50 px-2 py-0.5 rounded-full border border-sage-200"></span>
          </div>
          <h2 id="active-lesson-title" class="font-serif text-xl sm:text-2xl font-bold text-slatewarm-900 mt-1"></h2>
        </div>

        <div id="study-link-wrap"></div>
      </div>

      <!-- Search & Filter Controls -->
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2 flex-1">
          <input
            id="search-input"
            type="text"
            placeholder="Search words, phrases, or timestamp (e.g. 12:30)..."
            class="w-full sm:w-80 px-3.5 py-2 rounded-xl bg-white border border-[#dfd0b5] text-sm text-stone-800 focus:outline-none focus:ring-2 focus:ring-sage-500/30"
          />
          <select
            id="speaker-select"
            class="px-3 py-2 rounded-xl bg-white border border-[#dfd0b5] text-xs font-semibold text-stone-700 focus:outline-none"
          >
            <option value="all">All Speakers</option>
            <option value="Wei Jing">Wei Jing Only</option>
            <option value="Lewis">Lewis Only</option>
          </select>
          <button
            id="clear-filters-btn"
            type="button"
            class="px-3 py-2 rounded-xl bg-parchment-100 hover:bg-parchment-200 text-xs font-semibold text-stone-700 transition"
          >
            Clear
          </button>
        </div>

        <div class="text-xs font-mono text-stone-500" id="turn-count-label"></div>
      </div>

      <!-- Transcript Turns -->
      <div id="transcript-list" class="space-y-3 pt-2"></div>
    </section>
  </main>

  <script src="transcripts_data.js"></script>
  <script>
    (() => {
      const lessons = window.WEI_JING_TRANSCRIPTS || [];
      const selectorGrid = document.getElementById("lesson-selector-grid");
      const activeBadge = document.getElementById("active-lesson-badge");
      const activeDate = document.getElementById("active-lesson-date");
      const activeDuration = document.getElementById("active-lesson-duration");
      const activeTitle = document.getElementById("active-lesson-title");
      const studyLinkWrap = document.getElementById("study-link-wrap");
      const searchInput = document.getElementById("search-input");
      const speakerSelect = document.getElementById("speaker-select");
      const clearBtn = document.getElementById("clear-filters-btn");
      const turnCountLabel = document.getElementById("turn-count-label");
      const transcriptList = document.getElementById("transcript-list");

      const params = new URLSearchParams(window.location.search);
      const requestedId = params.get("lesson");
      let activeLessonId = lessons.some(l => l.id === requestedId)
        ? requestedId
        : (lessons[lessons.length - 1]?.id || "lesson-01");

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function highlightText(text, query) {
        const safe = escapeHtml(text);
        if (!query) return safe;
        const escapedQ = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        return safe.replace(new RegExp(`(${escapedQ})`, "gi"), '<mark class="bg-autumn-200/80 text-slatewarm-900 rounded px-0.5">$1</mark>');
      }

      function speakText(text) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        const ukVoice = voices.find(v => v.lang && v.lang.startsWith("en-GB"));
        if (ukVoice) utter.voice = ukVoice;
        utter.lang = "en-GB";
        utter.rate = 0.95;
        window.speechSynthesis.speak(utter);
      }

      function renderSelector() {
        selectorGrid.innerHTML = "";
        lessons.forEach(lesson => {
          const isActive = lesson.id === activeLessonId;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = isActive
            ? "text-left p-4 rounded-2xl bg-sage-700 text-white shadow-md transition ring-2 ring-sage-500/40"
            : "text-left p-4 rounded-2xl bg-parchment-50 hover:bg-white border border-parchment-300 text-slatewarm-900 transition shadow-sm";
          btn.innerHTML = `
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs font-mono font-bold uppercase tracking-wider ${isActive ? "text-autumn-200" : "text-sage-700"}">${escapeHtml(lesson.number)}</span>
              <span class="text-[11px] font-mono ${isActive ? "text-sage-100" : "text-stone-500"}">${escapeHtml(lesson.date)}</span>
            </div>
            <div class="font-serif font-bold text-base mt-1 leading-snug">${escapeHtml(lesson.title)}</div>
            <div class="text-[11px] mt-2 ${isActive ? "text-sage-100" : "text-stone-500"}">${lesson.turns.length} lines • ${escapeHtml(lesson.duration)}</div>
          `;
          btn.addEventListener("click", () => {
            activeLessonId = lesson.id;
            const url = new URL(window.location.href);
            url.searchParams.set("lesson", lesson.id);
            window.history.replaceState({}, "", url);
            renderSelector();
            renderTranscript();
          });
          selectorGrid.appendChild(btn);
        });
      }

      function renderTranscript() {
        const lesson = lessons.find(l => l.id === activeLessonId);
        if (!lesson) return;

        activeBadge.textContent = lesson.number;
        activeDate.textContent = lesson.date;
        activeDuration.textContent = lesson.duration;
        activeTitle.textContent = lesson.title;

        if (lesson.studyPage) {
          studyLinkWrap.innerHTML = `
            <a href="${escapeHtml(lesson.studyPage)}" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-sage-700 hover:bg-sage-800 text-white text-xs font-semibold shadow-sm transition">
              <span>✨ ${escapeHtml(lesson.studyLabel)} →</span>
            </a>
          `;
        } else {
          studyLinkWrap.innerHTML = "";
        }

        const query = searchInput.value.trim().toLowerCase();
        const speakerFilter = speakerSelect.value;

        const filtered = lesson.turns.filter(t => {
          if (speakerFilter !== "all" && t.speaker !== speakerFilter) return false;
          if (!query) return true;
          return (
            t.text.toLowerCase().includes(query) ||
            t.time.toLowerCase().includes(query) ||
            t.speaker.toLowerCase().includes(query)
          );
        });

        turnCountLabel.textContent = `Showing ${filtered.length} of ${lesson.turns.length} turns`;
        transcriptList.innerHTML = "";

        if (filtered.length === 0) {
          transcriptList.innerHTML = `
            <div class="p-8 text-center rounded-2xl bg-parchment-50 border border-parchment-200 text-stone-500 text-sm">
              No matching lines found in ${escapeHtml(lesson.number)}. Try clearing your search filter.
            </div>
          `;
          return;
        }

        let lastPart = "";
        filtered.forEach(turn => {
          if (turn.part && turn.part !== lastPart) {
            lastPart = turn.part;
            const divider = document.createElement("div");
            divider.className = "flex items-center gap-3 py-2";
            divider.innerHTML = `
              <div class="h-px flex-1 bg-parchment-300"></div>
              <span class="px-3 py-0.5 rounded-full bg-parchment-200 text-stone-700 text-[11px] font-mono font-semibold uppercase tracking-wider">${escapeHtml(turn.part)}</span>
              <div class="h-px flex-1 bg-parchment-300"></div>
            `;
            transcriptList.appendChild(divider);
          }

          const isWeiJing = turn.speaker === "Wei Jing";
          const card = document.createElement("div");
          card.className = isWeiJing
            ? "p-4 rounded-2xl bg-sage-50/80 border border-sage-200/80"
            : "p-4 rounded-2xl bg-white border border-parchment-200";

          card.innerHTML = `
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${isWeiJing ? "bg-sage-700 text-white" : "bg-autumn-100 text-autumn-800"}">
                  ${escapeHtml(turn.speaker)}
                </span>
                <span class="text-xs font-mono text-stone-400">${escapeHtml(turn.time)}</span>
              </div>
              <button type="button" class="speak-btn text-[11px] px-2 py-0.5 rounded-lg bg-parchment-100 hover:bg-parchment-200 text-stone-600 transition" title="Read aloud in UK English">
                🔊 Listen
              </button>
            </div>
            <p class="text-sm sm:text-[15px] leading-relaxed text-slatewarm-900">${highlightText(turn.text, searchInput.value.trim())}</p>
          `;

          card.querySelector(".speak-btn").addEventListener("click", () => speakText(turn.text));
          transcriptList.appendChild(card);
        });
      }

      searchInput.addEventListener("input", renderTranscript);
      speakerSelect.addEventListener("change", renderTranscript);
      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        speakerSelect.value = "all";
        renderTranscript();
      });

      renderSelector();
      renderTranscript();
    })();
  </script>
</body>
</html>
